<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Testimonios de Pacientes — Nutrición</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Suavizado de fuentes */
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-orange-50 via-rose-50 to-fuchsia-50 py-10 px-4 md:px-8">
  <header class="max-w-6xl mx-auto mb-8 text-center">
    <h1 class="text-4xl md:text-5xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-fuchsia-600 via-rose-600 to-orange-500">Testimonios de Pacientes</h1>
    <p class="mt-2 text-slate-600 max-w-2xl mx-auto">
      Historias reales, resultados medibles y hábitos sostenibles. Explora por palabra clave o por número de
      <span class="font-semibold">duraznos</span>.
    </p>
  </header>

  <main class="max-w-6xl mx-auto space-y-6">
    <!-- Tarjeta de promedio (no se filtra) -->
    <section id="averageCard" aria-live="polite"></section>

    <!-- Filtros -->
    <section class="w-full bg-white rounded-2xl p-4 shadow-lg border border-orange-300/60">
      <div class="grid md:grid-cols-3 gap-4">
        <div class="flex flex-col">
          <label for="q" class="text-sm font-semibold text-orange-700">Buscar por palabras clave</label>
          <input id="q" type="text" placeholder="Ej. vegano, diabetes, maratón, etiquetas…"
                 class="mt-1 rounded-xl border-2 border-orange-300 focus:outline-none focus:ring-4 focus:ring-orange-200 px-3 py-2" />
        </div>
        <div class="flex flex-col">
          <label for="rating" class="text-sm font-semibold text-fuchsia-700">Filtro de evaluación (duraznos)</label>
          <select id="rating" class="mt-1 rounded-xl border-2 border-fuchsia-300 focus:outline-none focus:ring-4 focus:ring-fuchsia-200 px-3 py-2">
            <option value="all">Todas</option>
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
          </select>
        </div>
        <div class="flex items-end gap-3">
          <label class="inline-flex items-center gap-2 select-none text-pink-700 font-medium">
            <input id="minMode" type="checkbox" class="h-4 w-4 rounded border-2 border-pink-400 text-pink-500 focus:ring-0" checked />
            Usar como mínimo (p. ej. ≥ 4)
          </label>
        </div>
      </div>
    </section>

    <!-- Resultados y paginación -->
    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-slate-800">Resultados <span id="resultCount"></span></h2>
        <div class="text-sm text-slate-600"><span id="showing"></span></div>
      </div>
      <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      <div id="pagination" class="flex flex-wrap items-center justify-center gap-2 mt-6"></div>
    </section>

    <footer class="pt-6 pb-10 text-center text-xs text-slate-500">
      * Las opiniones aquí mostradas son ejemplos de demostración. Sustituye la constante <code>ALL_TESTIMONIALS</code> con tus datos reales.
    </footer>
  </main>

  <script>
    // ====== Datos de ejemplo ======
    const ALL_TESTIMONIALS = [
      { id:1, name:"María López", age:29, rating:5, text:"Bajé 8 kg en 3 meses. El plan fue súper claro y sin pasar hambre. ¡Me siento con mucha energía!" },
      { id:2, name:"Carlos Méndez", age:41, rating:4, text:"Me ayudó a controlar la glucosa con un plan flexible. Excelente seguimiento y educación nutricional." },
      { id:3, name:"Fernanda Ruiz", age:35, rating:5, text:"La guía para entrenamiento y nutrición fue clave. Perdí grasa y gané masa muscular sin extremismos." },
      { id:4, name:"Jorge Hernández", age:52, rating:3, text:"Me costó adaptarme al principio, pero el ajuste por etapas funcionó. Ahora como mejor en el trabajo." },
      { id:5, name:"Ana García", age:24, rating:5, text:"Como vegana, por fin entendí cómo cubrir proteínas y B12. Mis análisis salieron excelentes." },
      { id:6, name:"Ricardo Paredes", age:46, rating:4, text:"Bajó mi presión arterial en 6 semanas. Plan realista con alternativas cuando viajo." },
      { id:7, name:"Paola Camacho", age:31, rating:5, text:"Aprendí a leer etiquetas y a organizar mi despensa. ¡Se me quitaron los antojos continuos!" },
      { id:8, name:"Luis Torres", age:38, rating:2, text:"El trabajo me complicó seguir el plan; aún así, mejoré desayuno y agua. Quiero retomar con más tiempo." },
      { id:9, name:"Diana Pérez", age:27, rating:4, text:"La app de seguimiento fue súper útil. Recetas ricas y prácticas para llevar al trabajo." },
      { id:10, name:"Héctor Salinas", age:55, rating:5, text:"Tenía hígado graso. Con el plan y caminatas diarias mis enzimas mejoraron notablemente." },
      { id:11, name:"Andrea Domínguez", age:33, rating:3, text:"Ajustamos condimentos y horarios. No bajé tan rápido, pero ya no tengo reflujo." },
      { id:12, name:"Miguel Castro", age:42, rating:5, text:"Programa para maratón + nutrición: mejoré tiempos y la recuperación fue increíble." },
      { id:13, name:"Sofía Aguilar", age:26, rating:4, text:"Aprendí a comer fuera sin culpas. Baje 4 kg en 6 semanas sin dietas raras." },
      { id:14, name:"Pablo Díaz", age:48, rating:2, text:"Viajé mucho y me salí del plan. Aun así, las recomendaciones para restaurantes me sirvieron." },
      { id:15, name:"Valeria Núñez", age:36, rating:5, text:"La educación nutricional cambió mi relación con la comida. ¡Recomendadísima!" },
      { id:16, name:"Roberto Reyes", age:39, rating:4, text:"Más energía en el día y mejor sueño. El plan alto en fibra me cayó perfecto." },
      { id:17, name:"Camila Flores", age:30, rating:5, text:"El menú semanal y la lista de súper me salvaron tiempo y dinero." },
      { id:18, name:"Daniel Ortiz", age:44, rating:3, text:"Me costó la hidratación, pero el recordatorio me ayudó. Seguiré mejorando hábitos." },
      { id:19, name:"Elena Rivas", age:50, rating:4, text:"Plan para menopausia con enfoque en calcio y proteína. Me siento más estable." },
      { id:20, name:"Javier Luna", age:28, rating:5, text:"Definición muscular sin perder rendimiento. Las colaciones fueron clave." },
    ];

    // ====== Utilidades UI ======
    const PER_PAGE = 6;
    let state = { q:"", rating:"all", minMode:true, page:1 };

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    function PeachSVG(filled=true, size=22) {
      const peachFill = filled ? "#FF8A65" : "none";
      const stroke = filled ? "#E64A19" : "#C7C7C7";
      const leafFill = filled ? "#43A047" : "none";
      const leafStroke = filled ? "#2E7D32" : "#C7C7C7";
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
          <path d="M32 56c14 0 24-10 24-22 0-9-7-15-14-15-4 0-7 2-10 5-3-3-6-5-10-5-7 0-14 6-14 15 0 12 10 22 24 22z" fill="${peachFill}" stroke="${stroke}" stroke-width="2.5" />
          <path d="M34 18c5-7 14-8 20-6-6 4-9 10-10 14-4-2-7-5-10-8z" fill="${leafFill}" stroke="${leafStroke}" stroke-width="2" />
          <path d="M22 28c-4 2-6 6-6 9" stroke="${filled ? '#FFD5C6' : '#E0E0E0'}" stroke-width="2" />
        </svg>`;
    }

    function ratingPeaches(value) {
      return `<div class="flex items-center gap-1" title="${value} / 5">${Array.from({length:5}).map((_,i)=>PeachSVG(i < value)).join("")}</div>`;
    }

    // ====== Filtro & búsqueda ======
    function getFiltered() {
      const q = state.q.trim().toLowerCase();
      const r = state.rating === 'all' ? null : parseInt(state.rating, 10);
      return ALL_TESTIMONIALS.filter(t => {
        const matchesQuery = q ? (`${t.name} ${t.text}`.toLowerCase().includes(q)) : true;
        const matchesRating = r ? (state.minMode ? t.rating >= r : t.rating === r) : true;
        return matchesQuery && matchesRating;
      });
    }

    // ====== Render promedio (no se filtra) ======
    function renderAverageCard() {
      const total = ALL_TESTIMONIALS.length;
      const sum = ALL_TESTIMONIALS.reduce((acc,t)=>acc+t.rating,0);
      const avg = sum / total; const rounded = Math.round(avg*10)/10;
      const bucket = [0,0,0,0,0]; ALL_TESTIMONIALS.forEach(t => bucket[t.rating-1]++);
      const maxBucket = Math.max(...bucket);

      $('#averageCard').innerHTML = `
        <div class="w-full bg-gradient-to-r from-fuchsia-500 via-rose-500 to-orange-400 text-white rounded-2xl p-5 shadow-xl">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <p class="uppercase tracking-widest text-white/80 text-xs mb-1">Promedio general (no se filtra)</p>
              <div class="flex items-center gap-3">
                <span class="text-5xl font-extrabold drop-shadow-sm">${rounded}</span>
                ${ratingPeaches(Math.round(avg))}
                <span class="text-white/90 text-sm">(${total} valoraciones)</span>
              </div>
            </div>
            <div class="grid grid-cols-5 gap-2 items-end w-full sm:w-auto">
              ${bucket.map((b,i)=>`
                <div class="flex flex-col items-center">
                  <div class="w-5 rounded-t-md bg-white/90" style="height:${Math.max(8, (b/(maxBucket||1))*60)}px" title="${5-i} duraznos: ${bucket[4-i]} opiniones"></div>
                  <span class="text-[10px] mt-1">${5-i}</span>
                </div>
              `).reverse().join('')}
            </div>
          </div>
        </div>`;
    }

    // ====== Render resultados y paginación ======
    function render() {
      const filtered = getFiltered();
      const start = (state.page - 1) * PER_PAGE;
      const current = filtered.slice(start, start + PER_PAGE);

      // Encabezado de resultados
      $('#resultCount').textContent = filtered.length ? `(${filtered.length})` : '';
      $('#showing').textContent = `Mostrando ${current.length} de ${filtered.length} coincidencias`;

      // Grid
      const grid = $('#grid');
      if (!current.length) {
        grid.innerHTML = `<div class="bg-white border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center text-slate-500 col-span-full">No encontramos testimonios con esos criterios. Prueba cambiar el número de duraznos o la palabra clave.</div>`;
      } else {
        grid.innerHTML = current.map(t => `
          <article class="group relative bg-white rounded-2xl border-2 border-transparent p-5 shadow-md hover:shadow-2xl hover:border-rose-400 transition duration-300 hover:-translate-y-1">
            <div class="absolute inset-0 -z-10 rounded-2xl bg-gradient-to-br from-rose-200 via-orange-100 to-yellow-100 opacity-0 group-hover:opacity-100 blur-2xl transition"></div>
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-lg font-extrabold text-slate-800">${t.name} <span class="text-slate-500 font-medium">· ${t.age} años</span></h3>
              ${ratingPeaches(t.rating)}
            </div>
            <p class="text-slate-700 leading-relaxed">${t.text}</p>
          </article>
        `).join('');
      }

      // Paginación
      const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
      const pag = $('#pagination');
      function btn(label, disabled, onClick, classes="") {
        return `<button ${disabled? 'disabled' : ''} class="px-3 py-2 rounded-xl ${classes} ${disabled ? 'opacity-40 cursor-not-allowed' : ''}" data-action="${onClick}">${label}</button>`;
      }
      let controls = '';
      controls += btn('◀', state.page===1, 'prev', 'bg-gradient-to-r from-fuchsia-500 to-rose-500 text-white shadow hover:shadow-lg transition');
      for (let p=1; p<=totalPages; p++) {
        const active = p===state.page;
        controls += btn(p, false, `page:${p}`, active ? 'bg-orange-400 text-white border-2 border-orange-500 shadow-lg' : 'bg-white text-slate-800 border-2 border-slate-200 hover:border-orange-300 shadow-sm');
      }
      controls += btn('▶', state.page===totalPages, 'next', 'bg-gradient-to-r from-orange-400 to-yellow-400 text-white shadow hover:shadow-lg transition');
      pag.innerHTML = controls;

      // Delegación de eventos de paginación
      pag.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', (e)=>{
          const act = e.currentTarget.getAttribute('data-action');
          if (act==='prev') state.page = Math.max(1, state.page-1);
          else if (act==='next') state.page = Math.min(totalPages, state.page+1);
          else if (act && act.startsWith('page:')) state.page = parseInt(act.split(':')[1],10);
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    // ====== Eventos de filtros ======
    $('#q').addEventListener('input', (e)=>{ state.q = e.target.value; state.page = 1; render(); });
    $('#rating').addEventListener('change', (e)=>{ state.rating = e.target.value; state.page = 1; render(); });
    $('#minMode').addEventListener('change', (e)=>{ state.minMode = e.target.checked; state.page = 1; render(); });

    // Init
    renderAverageCard();
    render();
  </script>
</body>
</html>
